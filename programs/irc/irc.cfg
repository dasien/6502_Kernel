# ld65 config for the MFC-DOS TERM (serial ANSI terminal) .PRG, based on
# cc65's none.cfg (identical layout to programs/edit/edit.cfg). Produces a raw
# image loaded/run at $0800 (user RAM); a 2-byte little-endian $0800
# load-address header is prepended after the build to form TERM.PRG.
#
# Layout in $0800-$8FFF user RAM:
#   $0800..        terminal code + the ANSI parser tables (RODATA/DATA)
#   C stack: 2KB growing down from $8F00
#   No heap: fixed buffers only, never malloc()s.
#   cc65 zero-page runtime at $0080 (free for a standalone .PRG).

FEATURES {
    STARTADDRESS: default = $0800;
}
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0800;   # 2K C stack
    __STACKSTART__: type = weak, value = $8F00;   # C stack top (grows down)
    __ZPSTART__:    type = weak, value = $0080;   # cc65 ZP runtime base
}
MEMORY {
    ZP:   file = "", define = yes, start = __ZPSTART__, size = $001F;
    MAIN: file = %O,               start = %S,          size = __STACKSTART__ - __STACKSIZE__ - %S;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = MAIN, type = ro,  optional = yes;
    LOWCODE:  load = MAIN, type = ro,  optional = yes;
    ONCE:     load = MAIN, type = ro,  optional = yes;
    CODE:     load = MAIN, type = rw;
    RODATA:   load = MAIN, type = rw;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss, define   = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
}
