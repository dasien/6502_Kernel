# ld65 config for the MFC-DOS SAY .PRG (S.A.M.), based on cc65's none.cfg.
# Produces a raw image loaded/run at $0800 (user RAM). A 2-byte little-endian
# $0800 load-address header is prepended after the build to form the .PRG.
#
# Layout in $0800-$87FF user RAM:
#   $0800..        the front end (CODE/RODATA/DATA), then RECITER and SAM
#                  (about 15.7 KB), each starting on a page: SAM's rendering
#                  tables are indexed by page and must be page aligned
#   C stack: 2KB growing down from $8700 (top of user RAM: DOS ROM starts $8800)
#   No heap: nothing here malloc()s.
#   cc65 zero-page runtime at $0080 (free for a standalone .PRG).

FEATURES {
    STARTADDRESS: default = $0800;
}
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0800;   # 2K C stack
    __STACKSTART__: type = weak, value = $8700;   # C stack top (grows down)
    __ZPSTART__:    type = weak, value = $0080;   # cc65 ZP runtime base
}
MEMORY {
    ZP:   file = "", define = yes, start = __ZPSTART__, size = $001F;
    MAIN: file = %O,               start = %S,          size = __STACKSTART__ - __STACKSIZE__ - %S;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = MAIN, type = ro,  optional = yes;
    LOWCODE:  load = MAIN, type = ro,  optional = yes;
    ONCE:     load = MAIN, type = ro,  optional = yes;
    CODE:     load = MAIN, type = rw;
    RODATA:   load = MAIN, type = rw;
    DATA:     load = MAIN, type = rw;
    RECITER:  load = MAIN, type = rw,  align = $100;
    SAM:      load = MAIN, type = rw,  align = $100;
    BSS:      load = MAIN, type = bss, define   = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
}
