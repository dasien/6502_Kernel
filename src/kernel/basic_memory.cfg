# EhBASIC Linker Configuration
# Loads BASIC ROM at $B000-$EFFF (16KB)

MEMORY {
    # BASIC ROM area
    BASIC: start = $B000, size = $4000, fill = yes, fillval = $00;
}

SEGMENTS {
    # Code segment (main BASIC interpreter)
    CODE: load = BASIC, type = ro, align = $100;

    # Data segment (lookup tables, string constants)
    DATA: load = BASIC, type = ro;

    # The ROM's identity block, its last 16 bytes (src/kernel/romid.inc).
    ROMID: load = BASIC, start = $EFF0, type = ro;
}
