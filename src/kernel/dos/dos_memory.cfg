# dos_memory.cfg - linker config for the MFC-DOS resident ROM
# Loads at $8800-$AFFF (10KB) - always mapped by the emulator (never banked).
# Holds the resident FAT16 filesystem and the DOS command shell.
# The signature/entry must be the first byte of CODE so it sits at $8800.
#
# The base moved down from $9000 to buy 2 KB: the DOS had 145 bytes left below
# the $AF00 ABI table while the kernel had 3.7 KB spare, so the pressure was all
# on this side. User RAM pays, dropping to $0800-$87FF. DOSJUMP stays at $AF00,
# so nothing that calls into the DOS had to change.

MEMORY {
    DOS: start = $8800, size = $2800, fill = yes, fillval = $00;
}

SEGMENTS {
    # Code first so the signature/entry lands exactly at $8800.
    CODE: load = DOS, type = ro;

    # Data (tables, strings).
    DATA: load = DOS, type = ro;

    # DOS ABI jump table at a fixed address ($AF00), like the kernel's $FF00
    # table. Callers bind to these stable entry points.
    DOSJUMP: load = DOS, start = $AF00, type = ro;
}
