# monitor_memory.cfg - linker config for the MFC monitor module
# Loads at $B000-$DFFF (12KB), the bankable module window, as bank 4. Same shape
# as basic_memory.cfg and the assembler's config: the window is fixed, and the
# host installs the image into a bank slot at power-on.
#
# The entry table must land at the very base ($B000/$B003) because the kernel
# jumps there by fixed address and tests the first byte to detect an uninstalled
# bank, so CODE is the first segment.

MEMORY {
    MONITOR: start = $B000, size = $3000, fill = yes, fillval = $00;
}

SEGMENTS {
    CODE: load = MONITOR, type = ro;
}
