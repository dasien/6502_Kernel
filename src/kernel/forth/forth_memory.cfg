# forth_memory.cfg - linker config for the FIG-Forth module ROM (module bank 3).
# Loads at $B000-$EFFF (16KB) - the bankable module window. ENTER must be the
# first byte of CODE so the module entry sits at $B000.
MEMORY {
    MODULE: start = $B000, size = $4000, fill = yes, fillval = $00;
}
SEGMENTS {
    CODE: load = MODULE, type = ro;
}
